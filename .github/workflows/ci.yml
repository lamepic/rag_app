name: CI

on:
  push:
  pull_request:

# Cancel an older run on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same values as .env.example; there is no .env file in CI.
      RAG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
      RAG_REDIS_URL: redis://127.0.0.1:6379/0
      RAG_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0 # match the local CLI

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      # Only what the app uses: Postgres, Auth, Storage and the Kong gateway in front of them.
      - name: Start Supabase
        run: >
          supabase start -x
          realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # The local S3 keys are generated by `supabase start`; hand them to later steps as
      # RAG_* env vars (masked in logs) instead of committing them anywhere.
      - name: Export Supabase S3 keys
        run: |
          eval "$(supabase status -o env | grep '^S3_PROTOCOL_ACCESS_KEY_')"
          echo "::add-mask::$S3_PROTOCOL_ACCESS_KEY_SECRET"
          echo "RAG_S3_ACCESS_KEY_ID=$S3_PROTOCOL_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "RAG_S3_SECRET_ACCESS_KEY=$S3_PROTOCOL_ACCESS_KEY_SECRET" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: make migrate

      - name: Lint, type check, schema drift, test
        run: make check
