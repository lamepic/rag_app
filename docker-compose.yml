# Local services that Supabase doesn't provide.
# Supabase runs separately via `supabase start`.
# The API and worker get added here in later milestones.
name: rag

services:
  redis:
    image: redis:8.2-alpine
    # Append-only file: Redis writes every change to disk, so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Bind to localhost only, so nothing else on your network can reach Redis.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
